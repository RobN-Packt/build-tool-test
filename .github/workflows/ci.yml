name: CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
      lambda:   ${{ steps.filter.outputs.lambda }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            backend:
              - 'apps/api/**'
              - '!apps/api/internal/lambda/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            lambda:
              - 'apps/api/internal/lambda/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'

  frontend_ci:
    name: Frontend lint & test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      USE_NX: ${{ vars.USE_NX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Task
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task

      - name: Frontend lint (Task)
        if: env.USE_NX != 'true'
        run: task frontend:lint

      - name: Frontend tests (Task)
        if: env.USE_NX != 'true'
        run: task frontend:test

      - name: Frontend lint (Nx)
        if: env.USE_NX == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec nx lint web

      - name: Frontend tests (Nx)
        if: env.USE_NX == 'true'
        run: pnpm exec nx test web

  backend_ci:
    name: Backend lint & test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      USE_NX: ${{ vars.USE_NX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # or whatever you use

      - name: Setup pnpm
        if: env.USE_NX == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        if: env.USE_NX == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Task
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Backend lint (Task)
        if: env.USE_NX != 'true'
        run: task backend:lint

      - name: Backend tests (Task)
        if: env.USE_NX != 'true'
        run: task backend:test

      - name: Backend lint (Nx)
        if: env.USE_NX == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec nx lint api

      - name: Backend tests (Nx)
        if: env.USE_NX == 'true'
        run: pnpm exec nx test api

  lambda_ci:
    name: Lambda lint & test
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    env:
      USE_NX: ${{ vars.USE_NX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # match backend

      - name: Setup pnpm
        if: env.USE_NX == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        if: env.USE_NX == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Task
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lambda lint (Task)
        if: env.USE_NX != 'true'
        run: task lambda:lint

      - name: Lambda tests (Task)
        if: env.USE_NX != 'true'
        run: task lambda:test

      - name: Lambda lint (Nx)
        if: env.USE_NX == 'true'
        run: pnpm install --frozen-lockfile && pnpm exec nx lint lambda

      - name: Lambda tests (Nx)
        if: env.USE_NX == 'true'
        run: pnpm exec nx test lambda

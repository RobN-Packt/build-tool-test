name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend:  ${{ steps.filter.outputs.backend }}
      lambda:   ${{ steps.filter.outputs.lambda }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'apps/web/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            backend:
              - 'apps/api/**'
              - '!apps/api/internal/lambda/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            lambda:
              - 'apps/api/internal/lambda/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'

  frontend_deploy:
    name: Frontend deploy (Vercel)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      USE_NX: ${{ vars.USE_NX || 'false' }}
      # add ORG/PROJECT envs here if you use them:
      # VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      # VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Frontend deploy (Task)
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task
          task frontend:deploy

      - name: Frontend deploy (Nx)
        if: env.USE_NX == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx lint web
          pnpm exec nx test web
          pnpm exec nx build web
          pnpm dlx vercel deploy --prod --yes --prebuilt --force --token "$VERCEL_TOKEN"

  backend_deploy:
    name: Backend deploy (ECS/Fargate)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      USE_NX: ${{ vars.USE_NX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup pnpm
        if: env.USE_NX == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        if: env.USE_NX == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Task
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Backend deploy (Task)
        if: env.USE_NX != 'true'
        run: task backend:deploy

      - name: Backend deploy (Nx)
        if: env.USE_NX == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx lint api
          pnpm exec nx test api
          GIT_SHA=$(git rev-parse --short HEAD)
          AWS_ACCOUNT_ID="750969166615"
          ECR_REPOSITORY="build-tool-test"
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          DOCKER_TAG="${GIT_SHA}"
          docker build -t "${DOCKER_IMAGE}:${DOCKER_TAG}" ./apps/api
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker push "${DOCKER_IMAGE}:${DOCKER_TAG}"
          sed "s/__IMAGE_TAG__/${DOCKER_TAG}/g" apps/api/ecs-task-def.json > apps/api/ecs-task-def.rendered.json
          TASKDEF_ARN=$(aws ecs register-task-definition \
            --no-cli-pager \
            --cli-input-json file://apps/api/ecs-task-def.rendered.json \
            --region "${AWS_REGION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered task definition: $TASKDEF_ARN"
          aws ecs update-service \
            --no-cli-pager \
            --cluster build-tool-test \
            --service build-tool-test-service-excyce51 \
            --task-definition "$TASKDEF_ARN" \
            --force-new-deployment \
            --region "${AWS_REGION}"

  lambda_deploy:
    name: Lambda deploy
    needs: changes
    if: needs.changes.outputs.lambda == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      USE_NX: ${{ vars.USE_NX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup pnpm
        if: env.USE_NX == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - name: Setup Node
        if: env.USE_NX == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install Task
        if: env.USE_NX != 'true'
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d
          sudo mv ./bin/task /usr/local/bin/task

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Lambda deploy (Task)
        if: env.USE_NX != 'true'
        run: task lambda:deploy

      - name: Lambda deploy (Nx)
        if: env.USE_NX == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec nx lint lambda
          pnpm exec nx test lambda
          pnpm exec nx build lambda
          cd apps/api/internal/lambda/bookemailer
          cp dist/bootstrap bootstrap
          zip deployment.zip bootstrap
          aws lambda update-function-code \
            --function-name built-tool-test-email \
            --zip-file fileb://deployment.zip \
            --region "${AWS_REGION}" \
            --no-cli-pager

version: "3"

vars:
  AWS_ACCOUNT_ID: "750969166615"
  ECR_REPOSITORY: build-tool-test
  ECR_REGISTRY: "{{.AWS_ACCOUNT_ID}}.dkr.ecr.{{.AWS_REGION}}.amazonaws.com"
  DOCKER_IMAGE: "{{.ECR_REGISTRY}}/{{.ECR_REPOSITORY}}"
  GIT_SHA:
    sh: git rev-parse --short HEAD
  DOCKER_TAG: "{{.GIT_SHA}}"
  ECS_SERVICE: build-tool-test-service-excyce51
  ECS_CLUSTER: build-tool-test

tasks:
  tidy:
    dir: "{{.BACKEND_DIR}}"
    cmds: [go mod tidy]

  test:
    dir: "{{.BACKEND_DIR}}"
    deps: [tidy]
    cmds: [go test ./...]

  lint:
    dir: "{{.BACKEND_DIR}}"
    cmds: [golangci-lint run]

  ci:
    deps: [test, lint]

  docker-build:
    dir: "{{.BACKEND_DIR}}"
    cmds:
      - docker build -t {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}} .

  docker-push:
    dir: "{{.BACKEND_DIR}}"
    deps: [docker-build]
    cmds:
      - aws ecr get-login-password --region {{.AWS_REGION}} | docker login --username AWS --password-stdin {{.ECR_REGISTRY}}
      - docker push {{.DOCKER_IMAGE}}:{{.DOCKER_TAG}}

  deploy:
    dir: "{{.BACKEND_DIR}}"
    deps: [docker-push]
    cmds:
      - |
        sed 's/__IMAGE_TAG__/{{.DOCKER_TAG}}/g' ecs-task-def.json > ecs-task-def.rendered.json
        TASKDEF_ARN=$(aws ecs register-task-definition \
          --no-cli-pager \
          --cli-input-json file://ecs-task-def.rendered.json \
          --region {{.AWS_REGION}} \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        aws ecs update-service \
          --no-cli-pager \
          --cluster {{.ECS_CLUSTER}} \
          --service {{.ECS_SERVICE}} \
          --task-definition "$TASKDEF_ARN" \
          --force-new-deployment \
          --region {{.AWS_REGION}}

version: "3"

tasks:
  install:
    cmds:
      - pnpm install --frozen-lockfile
    run: once

  test:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run test --if-present

  lint:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run lint

  build:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run vercel-build

  ci:
    deps: [lint, test]

  deploy:
    deps: [ci, build]
    cmds:
      - pnpm -w --filter ./apps/web... exec vercel deploy --prod --yes --token "$VERCEL_TOKEN"

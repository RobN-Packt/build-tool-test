version: "3"

vars:
  DIR: .

tasks:
  install:
    dir: "{{.DIR}}"
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    run: once

  test:
    dir: "{{.DIR}}"
    deps: [install]
    cmds: [pnpm run test --if-present]

  lint:
    dir: "{{.DIR}}"
    deps: [install]
    cmds: [pnpm run lint]

  build:
    dir: "{{.DIR}}"
    deps: [install]
    cmds: [pnpm run build]

  ci:
    deps: [lint, test]

  deploy:
    dir: "{{.DIR}}"
    deps: [build]
    cmds:
      - pnpm dlx vercel deploy --prod --yes --token "$VERCEL_TOKEN"

version: '3'

vars:
  FRONTEND_DIR: apps/web

tasks:
  install:
    dir: "{{.FRONTEND_DIR}}"
    desc: Install frontend deps
    run: once
    cmds:
      - pnpm install --frozen-lockfile
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules

  lint:
    dir: "{{.FRONTEND_DIR}}"
    desc: Lint frontend
    deps: [install]
    cmds:
      - pnpm lint

  test:
    dir: "{{.FRONTEND_DIR}}"
    desc: Test frontend
    deps: [install]
    cmds:
      - pnpm test --if-present

  build:
    dir: "{{.FRONTEND_DIR}}"
    desc: Build frontend
    deps: [install, lint, test]
    cmds:
      - pnpm build

  deploy:
    desc: Deploy frontend to Vercel (prebuilt, production)
    deps: [build]
    cmds:
      - pnpm dlx vercel --cwd "apps/web" pull --yes --environment=production --token "$VERCEL_TOKEN"
      - pnpm dlx vercel --cwd "apps/web" build --prod --token "$VERCEL_TOKEN"
      - pnpm dlx vercel --cwd "apps/web" deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"

version: "3"

tasks:
  install:
    cmds:
      - pnpm install --frozen-lockfile
    run: once

  test:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run test

  lint:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run lint

  build:
    deps: [install]
    cmds:
      - pnpm -w --filter ./apps/web... run vercel-build

  ci:
    deps: [lint, test]

  deploy:
    deps: [ci]
    dir: ./apps/web
    cmds:
      - test -n "$VERCEL_TOKEN" || (echo "VERCEL_TOKEN is not set" && exit 1)
      - test -n "$VERCEL_ORG_ID" || (echo "VERCEL_ORG_ID is not set" && exit 1)
      - test -n "$VERCEL_PROJECT_ID" || (echo "VERCEL_PROJECT_ID is not set" && exit 1)

      - pnpm dlx vercel@latest pull --environment=production --yes --token "$VERCEL_TOKEN"
      - pnpm dlx vercel@latest build --prod --token "$VERCEL_TOKEN"
      - pnpm dlx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
